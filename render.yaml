services:
  - type: web
    name: staffing-software
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: NODE_ENV=production npx prisma migrate deploy && NODE_ENV=production npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: staffing-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true   # Render auto-generates a secure random value
      - key: PORT
        value: 4000

databases:
  - name: staffing-db
    plan: free
    databaseName: staffing
